[General]
; niri 26.04's screenshot portal fails when more than one monitor is connected.
; 13.3 captures with grim instead. Flameshot 14 removed this option.
useGrimAdapter=true
disabledGrimWarning=true
showStartupLaunchMessage=false
savePath=/home/zhaown/Screenshots
filenamePattern=%Y-%m-%d_%H-%M-%S
; Copy also writes the file. A helper then puts that path on the clipboard as
; text, because Ghostty's Ctrl+V only pastes text and Cursor CLI turns an image
; path into an attachment.
saveAfterCopy=true
copyPathAfterSave=true
