palette = "noctalia"
command_timeout = 3000

# Palette roles (hex values are regenerated below the markers):
# lavender = primary (path), sapphire = tertiary (git),
# peach / yellow / teal = secondary (prompt and tools),
# green = staged, red = error, subtext0 = muted.

[character]
success_symbol = "[❯](bold peach)"
error_symbol = "[❯](bold red)"

[cmd_duration]
style = "bold yellow"

[custom.shell]
    command = "echo $STARSHIP_SHELL"  # shows output of command
    when = """ test "$STARSHIP_SHELL" != "fish" """
    style = "subtext0"
    format = "[$output]($style)"
    shell =["bash"]

# [custom.neovim]
# command = 'bob ls | rg Used | awk "{print \$2}"'  # shows output of command
# detect_folders = ["lua"]
# style = "green"
# format = "[ $output ]($style)"
# shell =["bash"]


[git_status]
style = "bold yellow"
untracked = '[ $count](bold peach) '
staged = '[ $count](bold green) '
stashed = "[ ](teal) "
deleted = '[ $count](bold red) '
modified= '[ $count](bold sapphire) '
behind = '[ ](bold mauve) '
ahead = '[ ](bold mauve) '
format = '([$all_status$ahead_behind]($style))'

[[battery.display]]
threshold = 50
style = "bold yellow"

[lua]
detect_folders = []
symbol = " "
style = "bold teal"

[git_metrics]
disabled = true

