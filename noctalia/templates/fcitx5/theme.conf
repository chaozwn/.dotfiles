# Generated by Noctalia from noctalia/templates/fcitx5/theme.conf.
# Colors follow the active palette (wallpaper and light/dark mode).

[Metadata]
Name=Noctalia
Version=1
Author=dotfiles
Description=Rounded candidate panel following the Noctalia palette
ScaleWithDPI=True

[InputPanel]
NormalColor={{ colors.on_surface.default.hex }}
HighlightColor={{ colors.primary.default.hex }}
HighlightBackgroundColor=#00000000
HighlightCandidateColor={{ colors.on_primary.default.hex }}
CandidateLabelColor={{ colors.primary.default.hex }}
HighlightCandidateLabelColor={{ colors.on_primary.default.hex }}
CandidateCommentColor={{ colors.outline.default.hex }}
HighlightCandidateCommentColor=#{{ colors.on_primary.default.hex_stripped }}b3
LabelTextSizeFactor=88
CommentTextSizeFactor=78
FullWidthHighlight=False
PageButtonAlignment=Last Candidate

[InputPanel/ShadowMargin]
Left=8
Right=8
Top=6
Bottom=10

[InputPanel/ContentMargin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/TextMargin]
Left=9
Right=9
Top=4
Bottom=4

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=26
Right=26
Top=26
Bottom=26

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight/HighlightClickMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu]
NormalColor={{ colors.on_surface.default.hex }}
HighlightCandidateColor={{ colors.on_primary.default.hex }}
Spacing=2

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=26
Right=26
Top=26
Bottom=26

[Menu/ContentMargin]
Left=6
Right=6
Top=4
Bottom=4

[Menu/TextMargin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Highlight]
Image=highlight.svg

[Menu/Highlight/Margin]
Left=12
Right=12
Top=12
Bottom=12

[Menu/Separator]
Color={{ colors.outline_variant.default.hex }}

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg
