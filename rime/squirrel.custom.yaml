# macOS Squirrel patches.
# Adapted from chaozwn/rime@config/squirrel.custom.yaml.
#
# CHANGES vs. the original:
# - All `vim_mode: true` entries are replaced with `vmode: true` so they
#   route through our cross-platform lua_processor (see lua/vim_mode.lua),
#   which behaves the same on Linux/fcitx5.
# - `vim_mode: false` entries are dropped because `vmode` defaults to on via
#   the `reset: 1` switch in rime_ice.custom.yaml.

patch:
  show_notifications_when: always

  # Same palette as fcitx5/themes/noctalia. Squirrel colors are 0xAABBGGRR.
  style/color_scheme: noctalia
  style/color_scheme_dark: noctalia

  preset_color_schemes:
    noctalia:
      name: Noctalia
      horizontal: true
      candidate_format: "%c %@ "
      corner_radius: 12
      hilited_corner_radius: 8
      font_point: 16
      label_font_point: 14
      comment_font_point: 13
      line_spacing: 8
      font_face: "PingFangSC-Regular,HanaMinB"
      text_color: 0xE9E2E1
      label_color: 0xFFC9A4
      back_color: 0xF225201D
      border_color: 0x99514741
      candidate_text_color: 0xE9E2E1
      comment_text_color: 0x9D918B
      hilited_text_color: 0xFFC9A4
      hilited_back_color: 0x00000000
      hilited_candidate_label_color: 0x5D3100
      hilited_candidate_back_color: 0xFFC9A4
      hilited_candidate_text_color: 0x5D3100
      hilited_comment_text_color: 0xCC5D3100

  # Per-app behavior. `vmode` defaults on; entries here mostly tune ASCII /
  # inline behavior and keep common app ids explicit.
  app_options/+:
    # ── Vim-family editors ──────────────────────────────────────
    org.vim.MacVim:
      no_inline: true
      vmode: true
    uk.foon.Neovim:
      no_inline: true
      vmode: true
    com.qvacua.VimR:
      no_inline: true
      vmode: true
    com.ident.goneovim:
      no_inline: true
      vmode: true

    # ── Terminals ───────────────────────────────────────────────
    com.googlecode.iterm2:
      no_inline: true
    com.apple.Terminal:
      no_inline: true

    # ── Terminals where I do use vim ────────────────────────────
    net.kovidgoyal.kitty:
      ascii_mode: true
      ascii_punct: true
      vmode: true
    com.mitchellh.ghostty:
      ascii_mode: true
      ascii_punct: true
      vmode: true

    # ── IDEs / editors that start in ASCII ──────────────────────
    com.todesktop.230313mzl4w4u92:   # Cursor
      ascii_mode: true
      ascii_punct: true
      vmode: true
    com.microsoft.VSCode:
      ascii_mode: true
      ascii_punct: true
      vmode: true
    com.jetbrains.intellij:
      vmode: true
    com.jetbrains.datagrip:
      vmode: true
    com.jetbrains.WebStorm:
      vmode: true

    # ── Notes / writing ─────────────────────────────────────────
    md.obsidian:
      vmode: true

    # ── Launchers / utilities ───────────────────────────────────
    com.alfredapp.Alfred:
      ascii_mode: true

    # ── AntDraw web apps (no inline) ────────────────────────────
    com.microsoft.edgemac.app.jndbnbljngolcchhjbajncidekccnlck:
      no_inline: true
    com.google.Chrome.app.jndbnbljngolcchhjbajncidekccnlck:
      no_inline: true
