# Status layout for the Noctalia palette. Source this after themes/noctalia.conf.
# Colors are format references, so they follow the palette on each redraw.

set -g status-justify left
set -g status-left-length 40
set -g status-right-length 72
set -g status-left-style none
set -g status-right-style none

set -g status-left "#[fg=#{@noctalia_on_primary},bg=#{@noctalia_primary},bold] #S #[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_low},nobold]"

set -g window-status-separator ""
set -gF window-status-style "fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}"
set -gF window-status-current-style "fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest},bold"
set -gF window-status-last-style "fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}"
set -g window-status-format "#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}] #I  #W "
set -g window-status-current-format "#[fg=#{@noctalia_surface_container_low},bg=#{@noctalia_surface_container_highest}]#[fg=#{@noctalia_primary},bg=#{@noctalia_surface_container_highest},bold] #I  #W #[fg=#{@noctalia_surface_container_highest},bg=#{@noctalia_surface_container_low},nobold]"

# continuum_save.sh stays in status-right so autosave keeps running after this file replaces it.
# #{?} splits on commas, so styles here are separate #[fg=] #[bg=] attributes.
set -g status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?client_prefix,#[fg=#{@noctalia_surface_container_low}]#[bg=#{@noctalia_primary_container}]#[fg=#{@noctalia_on_primary_container}]#[bg=#{@noctalia_primary_container}]#[bold] ^A #[fg=#{@noctalia_primary_container}]#[bg=#{@noctalia_surface_container_high}],}#[fg=#{@noctalia_surface_container_high}]#[bg=#{@noctalia_surface_container_low}]#[fg=#{@noctalia_on_surface}]#[bg=#{@noctalia_surface_container_high}] %m-%d  %H:%M #[fg=#{@noctalia_primary}]#[bg=#{@noctalia_surface_container_high}]#[fg=#{@noctalia_on_primary}]#[bg=#{@noctalia_primary}]#[bold] #h "
