# Candidate window. Colors are rendered by Noctalia into
# ~/.local/share/fcitx5/themes/noctalia whenever the palette changes.

# 垂直候选列表
Vertical Candidate List=False
# 使用鼠标滚轮翻页
WheelForPaging=True
# 字体
Font="HarmonyOS Sans SC 15"
# 菜单字体
MenuFont="HarmonyOS Sans SC 13"
# 主题
Theme=noctalia
# 深色主题
DarkTheme=noctalia
# 跟随系统浅色/深色
UseDarkTheme=False
# 跟随系统强调色
UseAccentColor=False
# 使用输入法语言显示文字
UseInputMethodLanguageToDisplayText=True
# 在 Wayland 上启用分数缩放
EnableFractionalScale=True
